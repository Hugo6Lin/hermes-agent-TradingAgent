  </text>

  <rect x="76" y="194" width="478" height="428" rx="24" fill="url(#panel)" stroke="#22453D" filter="url(#shadow)"/>
  <text x="108" y="240" fill="#C8F4E4" font-size="16" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">SIGNAL ENGINE</text>
  <text x="108" y="286" fill="#FFFFFF" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
