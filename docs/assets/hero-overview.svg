  </text>

  <rect x="108" y="356" width="168" height="92" rx="18" fill="#10221E" stroke="#2B5B4E"/>
  <text x="132" y="390" fill="#EAF8F2" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Signal</text>
  <text x="132" y="420" fill="#98BBB2" font-size="16" font-family="Segoe UI, Arial, sans-serif">rating / entry / stop</text>

  <rect x="292" y="356" width="168" height="92" rx="18" fill="#10221E" stroke="#2B5B4E"/>
  <text x="316" y="390" fill="#EAF8F2" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Backtest</text>
  <text x="316" y="420" fill="#98BBB2" font-size="16" font-family="Segoe UI, Arial, sans-serif">5 / 20 / 60 日 edge</text>

  <rect x="108" y="470" width="168" height="92" rx="18" fill="#10221E" stroke="#2B5B4E"/>
  <text x="132" y="504" fill="#EAF8F2" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Risk</text>
  <text x="132" y="534" fill="#98BBB2" font-size="16" font-family="Segoe UI, Arial, sans-serif">Sharpe / MDD / VaR</text>

  <rect x="292" y="470" width="168" height="92" rx="18" fill="#10221E" stroke="#2B5B4E"/>
  <text x="316" y="504" fill="#EAF8F2" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Service</text>
  <text x="316" y="534" fill="#98BBB2" font-size="16" font-family="Segoe UI, Arial, sans-serif">viewer / alerts / launchd</text>

  <path d="M584 408C664 408 672 408 746 408" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M736 392L772 408L736 424" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="782" y="194" width="340" height="428" rx="24" fill="#F4FAF8" filter="url(#shadow)"/>
  <text x="816" y="240" fill="#215044" font-size="16" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">BOSS DECISION LOOP</text>
