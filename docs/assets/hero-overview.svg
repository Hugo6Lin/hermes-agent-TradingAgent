  </text>

  <rect x="816" y="324" width="272" height="68" rx="16" fill="#E5F8F1"/>
  <text x="842" y="350" fill="#167C63" font-size="14" font-family="Segoe UI, Arial, sans-serif">TOP SIGNAL</text>
  <text x="842" y="377" fill="#0A1714" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">S | AAPL | Priority 91</text>

  <rect x="816" y="408" width="272" height="146" rx="16" fill="#F7FCFA" stroke="#D5E9E1"/>
  <text x="842" y="438" fill="#4B6B62" font-size="14" font-family="Segoe UI, Arial, sans-serif">TRADE PLAN</text>
  <text x="842" y="468" fill="#13211D" font-size="18" font-family="Segoe UI, Arial, sans-serif">Entry: 182.00 - 185.50</text>
  <text x="842" y="496" fill="#13211D" font-size="18" font-family="Segoe UI, Arial, sans-serif">Stop: 176.00</text>
  <text x="842" y="524" fill="#13211D" font-size="18" font-family="Segoe UI, Arial, sans-serif">Take Profit: 198.00</text>

  <circle cx="850" cy="588" r="6" fill="#2DD4BF"/>
  <text x="868" y="593" fill="#425D56" font-size="16" font-family="Segoe UI, Arial, sans-serif">后台轮询、决策告警、收盘后摘要</text>

  <text x="76" y="660" fill="#8DB2A8" font-size="18" font-family="Segoe UI, Arial, sans-serif">
