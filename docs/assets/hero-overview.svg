<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081310"/>
      <stop offset="1" stop-color="#0F1F1B"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#112823"/>
      <stop offset="1" stop-color="#0A1714"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="664" rx="24" stroke="#21463D" stroke-width="2"/>

  <text x="76" y="108" fill="#F4FAF8" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    Hermes Agent
  </text>
  <text x="76" y="146" fill="#9AC7BC" font-size="22" font-family="Segoe UI, Arial, sans-serif">
