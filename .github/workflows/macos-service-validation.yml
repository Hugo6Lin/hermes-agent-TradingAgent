name: macOS Service Validation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-macos-service:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Generate launch agent plist
        run: |
          python - <<'PY'
          from pathlib import Path
          from agent.research_v1.macos_service import LaunchAgentConfig, build_launch_agent_plist

          output_path = Path(".github/macos/generated.com.hermes.agent.plist")
          plist = build_launch_agent_plist(
              LaunchAgentConfig(
                  label="com.hermes.agent",
                  program_arguments=["/usr/bin/python3", "-m", "agent.research_v1.cli"],
                  working_directory=str(Path.cwd()),
                  standard_out_path="/tmp/hermes.out",
                  standard_error_path="/tmp/hermes.err",
                  run_at_load=True,
                  keep_alive=True,
                  start_interval=300,
              )
          )
          output_path.write_text(plist, encoding="utf-8")
          PY

      - name: Validate launch agent plist
        run: plutil -lint .github/macos/generated.com.hermes.agent.plist

      - name: Run macOS service tests
        run: python -m pytest tests/agent/research_v1/test_p5_service_mode.py -v
